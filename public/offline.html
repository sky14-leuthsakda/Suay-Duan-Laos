<!doctype html>
<html lang="lo" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#be123c" />
    <title>Suay Duan Lao — ບໍ່ມີສັນຍານອິນເຕີເນັດ (Offline)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Lao", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 28px;
        padding: 28px 20px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .icon-container {
        width: 68px;
        height: 68px;
        border-radius: 22px;
        background: rgba(225, 29, 72, 0.15);
        color: #f43f5e;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        border: 1px solid rgba(225, 29, 72, 0.3);
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .alert-box {
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: #fcd34d;
        padding: 12px;
        border-radius: 16px;
        font-size: 12px;
        margin-bottom: 20px;
        text-align: left;
        line-height: 1.5;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 16px;
        border-radius: 18px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease, filter 0.1s ease;
        margin-bottom: 10px;
        min-height: 56px;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-sos {
        background: #e11d48;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
      }
      .btn-call {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
      }
      .btn-retry {
        background: transparent;
        color: #94a3b8;
        font-size: 12px;
        min-height: 44px;
        border: none;
      }
      .numbers-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
      }
      .num-btn {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 10px 4px;
        text-decoration: none;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 56px;
        justify-content: center;
      }
      .num-title {
        font-size: 10px;
        color: #94a3b8;
      }
      .num-digits {
        font-size: 16px;
        font-weight: 900;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>ບໍ່ມີສັນຍານອິນເຕີເນັດ</h1>
      <p>ທ່ານກຳລັງຢູ່ໃນໂໝດອອບລາຍ. ຫາກຕ້ອງການຄວາມຊ່ວຍເຫຼືອດ່ວນທີ່ສຸດ, ກະລຸນາໂທສາຍດ່ວນ ຫຼື ສົ່ງຂໍ້ຄວາມ SMS ຫາສູນກູ້ໄພ.</p>

      <div class="alert-box">
        ⚠️ <strong>ໂທສຸກເສີນຟຣີ 24 ຊົ່ວໂມງ:</strong> ເຖິງບໍ່ມີດາຕ້າອິນເຕີເນັດ ກໍສາມາດໂທສາຍດ່ວນໄດ້ທັນທີ
      </div>

      <!-- Quick numbers grid -->
      <div class="numbers-grid">
        <a href="tel:191" class="num-btn">
          <span class="num-title">ຕຳຫຼວດ</span>
          <span class="num-digits">191</span>
        </a>
        <a href="tel:190" class="num-btn">
          <span class="num-title">ດັບເພີງ</span>
          <span class="num-digits">190</span>
        </a>
        <a href="tel:195" class="num-btn">
          <span class="num-title">ກູ້ໄພ/ແພດ</span>
          <span class="num-digits">195</span>
        </a>
      </div>

      <!-- Fallback actions -->
      <a href="sms:195?body=%5BSOS%20%E0%BA%8A%E0%BB%88%E0%BA%A7%E0%BA%A2%E0%BA%94%E0%BB%88%E0%BA%A7%E0%BA%99%5D%20%E0%BA%82%E0%BB%89%E0%BA%AD%E0%BA%8D%E0%BA%95%E0%BB%89%E0%BA%AD%E0%BA%87%E0%BA%81%E0%BA%B2%E0%BA%99%E0%BA%84%E0%BA%A7%E0%BA%B2%E0%BA%A1%E0%BA%8A%E0%BB%88%E0%BA%A7%E0%BA%A2%E0%BA%87%E0%BA%AB%E0%BA%BC%E0%BA%B7%E0%BA%AD%E0%BA%94%E0%BB%88%E0%BA%A7%E0%BA%99!" class="btn btn-sos">
        ✉️ ສົ່ງ SMS ສຸກເສີນຫາ 195
      </a>

      <button type="button" onclick="window.location.reload()" class="btn btn-retry">
        🔄 ກົດລອງເຊື່ອມຕໍ່ໃໝ່ (Reload Page)
      </button>
    </div>
  </body>
</html>
